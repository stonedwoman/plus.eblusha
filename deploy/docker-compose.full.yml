# Полный стек Eblusha Plus (Postgres, Redis, Backend, Worker, LiveKit, Nginx)
# Запуск: docker compose -f deploy/docker-compose.full.yml --env-file .env up -d
#
# Перед первым запуском:
# 1. Скопируйте .env.example в .env и заполните секреты (в т.ч. POSTGRES_PASSWORD)
# 2. Соберите frontend: cd frontend && npm ci && npm run build
# 3. Миграции выполняются автоматически при старте backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: eblusha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eblusha
      POSTGRES_USER: eblusha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eblusha}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eblusha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eblusha"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eblusha-net

  redis:
    image: redis:7-alpine
    container_name: eblusha-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - eblusha-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - eblusha-net

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
    volumes:
      - /var/lib/eblusha/storage:/var/lib/eblusha/storage
      - eblusha-upload-tmp:/app/tmp/uploads
    # Backend port: только host loopback. Снаружи backend живёт исключительно
    # через nginx (docker-сеть → backend:4000). 127.0.0.1:4000 на хосте оставлен,
    # чтобы локальные скрипты/curl с самого сервера могли стучаться напрямую.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - /var/lib/eblusha/storage:/var/lib/eblusha/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net

  maintenance:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-maintenance
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "while true; do node dist/scripts/gcUploadSessions.js --delete --max-age-hours ${UPLOAD_TMP_GC_MAX_AGE_HOURS:-24}; node dist/scripts/gcUnusedStorageFiles.js --delete; sleep ${STORAGE_GC_INTERVAL_SECONDS:-86400}; done",
      ]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - /var/lib/eblusha/storage:/var/lib/eblusha/storage
      - eblusha-upload-tmp:/app/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eblusha-net

  # LiveKit: WebRTC сервер для голосовых/видеозвонков
  livekit:
    image: livekit/livekit-server:latest
    container_name: eblusha-livekit
    restart: unless-stopped
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "/usr/local/bin/render-livekit-config.sh"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml.template:ro
      - ./render-livekit-config.sh:/usr/local/bin/render-livekit-config.sh:ro
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "58000-58100:58000-58100/udp"
    depends_on:
      - backend
    networks:
      - eblusha-net

  # Nginx: SPA + reverse proxy к backend + LiveKit
  # Требует предварительной сборки frontend: cd frontend && npm run build
  # Bind mount: ../frontend/dist -> /var/www/plus.eblusha.org (сборка SPA)
  # Bind mount: ../frontend/public -> /var/www/plus.eblusha.org-public — весь каталог целиком, включая любые подпапки;
  #   новые/изменённые файлы на хосте сразу видны в контейнере (отдельный sync не нужен). Nginx: open_file_cache off в nginx-docker.conf.
  nginx:
    image: nginx:alpine
    container_name: eblusha-nginx
    restart: unless-stopped
    ports:
      # Публичный вход (раньше занимал Cosmos на хосте)
      - "80:80"
      - "443:443"
      # Админка: только loopback хоста — наружу/в туннели не выходит.
      # Доступ: ssh -L 8088:127.0.0.1:8088 host → http://127.0.0.1:8088/admin.html
      - "127.0.0.1:8088:8088"
    volumes:
      - ../frontend/dist:/var/www/plus.eblusha.org:ro
      - ../frontend/public:/var/www/plus.eblusha.org-public:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - livekit
    networks:
      - eblusha-net

volumes:
  eblusha-postgres-data:
  eblusha-redis-data:
  eblusha-upload-tmp:

networks:
  eblusha-net:
    driver: bridge
