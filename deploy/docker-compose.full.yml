# Полный стек Eblusha Plus для CasaOS / Docker
# Запуск из корня проекта: docker compose -f deploy/docker-compose.full.yml up -d
#
# Перед первым запуском:
# 1. Скопируйте .env.example в .env и заполните секреты (в т.ч. POSTGRES_PASSWORD)
# 2. Соберите frontend: cd frontend && npm ci && npm run build
# 3. Миграции выполняются автоматически при старте backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: eblusha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eblusha
      POSTGRES_USER: eblusha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eblusha}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eblusha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eblusha"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eblusha-net

  redis:
    image: redis:7-alpine
    container_name: eblusha-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - eblusha-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - eblusha-net

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net

  # Nginx: SPA + reverse proxy к backend
  # Требует предварительной сборки frontend: cd frontend && npm run build
  # Bind mount: ../frontend/dist -> /var/www/plus.eblusha.org
  nginx:
    image: nginx:alpine
    container_name: eblusha-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../frontend/dist:/var/www/plus.eblusha.org:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - eblusha-net

volumes:
  eblusha-postgres-data:
  eblusha-redis-data:

networks:
  eblusha-net:
    driver: bridge
