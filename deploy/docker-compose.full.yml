# Полный стек Eblusha Plus (Postgres, Redis, Backend, Worker, LiveKit, Nginx)
# Запуск: docker compose -f deploy/docker-compose.full.yml --env-file .env up -d
#
# Перед первым запуском:
# 1. Скопируйте .env.example в .env и заполните секреты (в т.ч. POSTGRES_PASSWORD)
# 2. Соберите frontend: cd frontend && npm ci && npm run build
# 3. Миграции выполняются автоматически при старте backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: eblusha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eblusha
      POSTGRES_USER: eblusha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eblusha}
    ports:
      # Только для самого сервера (host .env ходит на 127.0.0.1); раньше было открыто всей локальной сети
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eblusha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eblusha"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eblusha-net

  redis:
    image: redis:7-alpine
    container_name: eblusha-redis
    restart: unless-stopped
    ports:
      # Только для самого сервера; Redis без пароля — нельзя открывать локальной сети
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - eblusha-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - eblusha-net

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
    volumes:
      - /var/lib/eblusha/storage:/var/lib/eblusha/storage
      # Eblusha Cloud: оригиналы, производные, staging. Backend пишет сюда как root
      # (создание объектов, уборка корзины); nginx монтирует тот же путь read-only.
      - /var/lib/eblusha/cloud:/var/lib/eblusha/cloud
      - eblusha-upload-tmp:/app/tmp/uploads
    # Backend port: только host loopback. Снаружи backend живёт исключительно
    # через nginx (docker-сеть → backend:4000). 127.0.0.1:4000 на хосте оставлен,
    # чтобы локальные скрипты/curl с самого сервера могли стучаться напрямую.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - /var/lib/eblusha/storage:/var/lib/eblusha/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net

  # Медиа-обработка Eblusha Cloud: ffmpeg (постеры, web-версии видео) и sharp
  # (превью, EXIF). Отдельный контейнер, потому что перекодирование видео может
  # занять все ядра на часы и не должно конкурировать с чатом и звонками.
  #
  # user 1000:101 — НЕ root: этот процесс скармливает ffmpeg/libvips недоверенные
  # файлы пользователей. Ему хватает чтения objects/ (gid 101) и записи в
  # derived/ и tmp/. Прав на удаление оригиналов у него нет — уборкой занят backend.
  cloud-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-cloud-worker
    restart: unless-stopped
    user: "1000:101"
    command: ["node", "dist/cloudWorker.js"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - /var/lib/eblusha/cloud:/var/lib/eblusha/cloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net

  face-worker:
    build:
      context: ..
      dockerfile: deploy/faces.Dockerfile
    container_name: eblusha-face-worker
    restart: unless-stopped
    user: "1000:101"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - /var/lib/eblusha/cloud:/var/lib/eblusha/cloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eblusha-net


  maintenance:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eblusha-maintenance
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "while true; do node dist/scripts/gcUploadSessions.js --delete --max-age-hours ${UPLOAD_TMP_GC_MAX_AGE_HOURS:-24}; node dist/scripts/gcUnusedStorageFiles.js --delete; sleep ${STORAGE_GC_INTERVAL_SECONDS:-86400}; done",
      ]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://eblusha:${POSTGRES_PASSWORD:-eblusha}@postgres:5432/eblusha?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - /var/lib/eblusha/storage:/var/lib/eblusha/storage
      - eblusha-upload-tmp:/app/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eblusha-net

  # LiveKit: WebRTC сервер для голосовых/видеозвонков
  livekit:
    image: livekit/livekit-server:v1.12.0
    container_name: eblusha-livekit
    restart: unless-stopped
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "/usr/local/bin/render-livekit-config.sh"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml.template:ro
      - ./render-livekit-config.sh:/usr/local/bin/render-livekit-config.sh:ro
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "58000-58100:58000-58100/udp"
    depends_on:
      - backend
    networks:
      - eblusha-net

  # Nginx: SPA + reverse proxy к backend + LiveKit
  # Требует предварительной сборки frontend: cd frontend && npm run build
  # Bind mount: ../frontend/dist -> /var/www/eblusha.org (сборка SPA)
  # Bind mount: ../frontend/public -> /var/www/eblusha.org-public — весь каталог целиком, включая любые подпапки;
  #   новые/изменённые файлы на хосте сразу видны в контейнере (отдельный sync не нужен). Nginx: open_file_cache off в nginx-docker.conf.
  nginx:
    image: nginx:alpine
    container_name: eblusha-nginx
    restart: unless-stopped
    ports:
      # Публичный вход (раньше занимал Cosmos на хосте)
      - "80:80"
      - "443:443"
      # Админка: слушает на всех интерфейсах хоста → доступна в локальной сети
      #   (http://stoned.local:8088/admin.html или http://192.168.1.129:8088/admin.html).
      #   Наружу в интернет НЕ уходит: роутер порт 8088 не форвардит, в CF Tunnel не включён.
      #   Защита — ADMIN_TOKEN (adminAuth). Раньше был только loopback: "127.0.0.1:8088:8088".
      #   Бинд именно 0.0.0.0 (а не на LAN-IP), т.к. enp1s0 на DHCP: привязка к конкретному
      #   адресу ломала бы старт nginx при смене лизы, а он отдаёт и публичный сайт на 80/443.
      - "8088:8088"
    volumes:
      - ../frontend/dist:/var/www/eblusha.org:ro
      - ../frontend/public:/var/www/eblusha.org-public:ro
      # Игра «Атолл» (отдельный репозиторий) — статика на eblusha.org/game
      - /DATA/eblusha-game/dist:/var/www/atoll:ro
      # updates/ подсовывается сквозь bindfs (см. /etc/fstab на хосте): FUSE-вид с
      # принудительными правами a+rD. Что бы ни положили (600/000, mv, rsync -p,
      # tar -p) — nginx (uid 101) всегда прочитает. Вложенный маунт перекрывает
      # подпапку updates родительского public-маунта.
      - /srv/eblusha-public-updates:/var/www/eblusha.org-public/updates:ro
      - ../vpn-logs:/var/www/vpn-logs
      # Eblusha Cloud: nginx отдаёт файлы напрямую по X-Accel-Redirect
      # (internal-локация /__cloud_internal/), Node в передаче байтов не участвует.
      - /var/lib/eblusha/cloud:/var/lib/eblusha/cloud:ro
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-eblusha-origin-locations.inc:/etc/nginx/conf.d/eblusha-origin-locations.inc:ro
      - ./nginx-cloud.inc:/etc/nginx/conf.d/eblusha-cloud.inc:ro
      - ./nginx-cloud-host.inc:/etc/nginx/conf.d/eblusha-cloud-host.inc:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - livekit
    networks:
      - eblusha-net

  # Бот «Еблуша» (bot/, отдельный пакет): обычный пользователь мессенджера, ходит в backend по HTTP
  # и socket.io, к модели — напрямую на api.anthropic.com (выход stoned через Румынию, прокси не нужен).
  # ПРОФИЛЬ bot: общий `up -d` стека бота НЕ поднимает. Запуск: `... --profile bot up -d eblusha-bot`.
  # Бот — часть системы: обращения берёт из очереди BullMQ `bot` в Redis (BOT_REDIS_URL), отвечает
  # через /api/bot/* backend. Перед первым запуском этой версии — миграция system_bot (backend) и
  # src/scripts/setupSystemBot.ts --apply (bot/README.md, «Выкладка»).
  # network_mode: host — модулю Valheim нужен WebMap на 127.0.0.1:3010 (слушает только loopback);
  # backend при этом — 127.0.0.1:4000 (порт опубликован на loopback хоста).
  # Секреты: ../.env.bot-account — логин/пароль бота и id владельца (src/scripts/seedBotUser.ts),
  #          ../.env.bot         — ANTHROPIC_API_KEY (кладёт владелец; без него бот отвечает шаблонами).
  # Состояние (SQLite: расходы, привязки ников, подтверждения) — том eblusha-bot-data. Подробности: bot/README.md.
  eblusha-bot:
    profiles: ["bot"]
    build:
      context: ../bot
      dockerfile: Dockerfile
    image: eblusha-bot:latest
    container_name: eblusha-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ../.env.bot-account
        required: false
      - path: ../.env.bot
        required: false
    environment:
      BOT_API_URL: http://127.0.0.1:${BACKEND_PORT:-4000}
      # Очередь обращений к боту (BullMQ `bot`, кладёт backend — src/lib/systemBot.ts): Redis стека,
      # опубликованный только на loopback хоста. Бот — часть системы, сокет и членство в беседах не нужны.
      BOT_REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}/0
      BOT_DATA_DIR: /data
      # Модуль Valheim (сервер Koban): bot/src/modules/valheim, переменные VALHEIM_* — bot/README.md.
      BOT_MODULES: valheim
      VALHEIM_BOT_TOKEN_FILE: /run/secrets/webmap-bot.token
      VALHEIM_OPS_SOCKET: /run/valheim-ops/ops.sock
    volumes:
      - eblusha-bot-data:/data
      # Токен закрытого канала мода WebMap для бота (X-Bot-Token, только чтение). Файл должен
      # существовать ДО запуска (bot/README.md, «Выкладка»): без него compose откажется стартовать,
      # а не создаст на его месте каталог (что сломало бы мод).
      - type: bind
        source: /DATA/valheim/config/bepinex/webmap-bot.token
        target: /run/secrets/webmap-bot.token
        read_only: true
        bind:
          create_host_path: false
      # Сокет помощника valheim-ops (bot/ops): команды владельца — рестарт, бэкап, настройки мира.
      - /run/valheim-ops:/run/valheim-ops
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend

volumes:
  eblusha-postgres-data:
  eblusha-redis-data:
  eblusha-upload-tmp:
  eblusha-bot-data:

networks:
  eblusha-net:
    driver: bridge
