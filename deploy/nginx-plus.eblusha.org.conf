server {
  # plus — прямой вход; eblusha.org / www — тот же сайт при DNS через Cloudflare Tunnel
  # voice — если LIVEKIT_URL=wss://voice.eblusha.org (тот же nginx, см. deploy/cloudflared/README.md)
  server_name plus.eblusha.org eblusha.org www.eblusha.org voice.eblusha.org;

  client_max_body_size 1024m;

  root /var/www/plus.eblusha.org;
  index index.html;

  # Не кешировать JSON с кодом (иначе после смены кода в игре виден старый)
  location = /v/valheim-join-code.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
  }

  # Serve SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # LiveKit signal/WebSocket proxy when LIVEKIT_PATH=/api/voice
  location /api/voice/ {
    rewrite ^/api/voice(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Proxy API to Node
  location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;  # Stream uploads so client gets progress events during transfer
  }

  # Socket.IO / WebSocket upgrade
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}


