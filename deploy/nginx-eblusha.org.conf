server {
  # Основной сайт: eblusha.org / www; voice — если LIVEKIT_URL=wss://voice.eblusha.org (см. deploy/cloudflared/README.md)
  server_name eblusha.org www.eblusha.org voice.eblusha.org;

  client_max_body_size 1024m;

  # Админка наружу не должна светиться — отдаём её только локальному nginx-блоку (см. nginx-docker.conf, listener 8088).
  location = /admin.html { return 404; }
  location ^~ /api/admin/ { return 404; }

  # Статическая страница из frontend/public/404.html (SPA иначе не отдаёт nginx 404)
  error_page 404 /404.html;
  location = /404.html {
    root /var/www/eblusha.org-public;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Valheim landing: HTML не кешировать (иначе после деплоя видна старая разметка)
  location = /v/index.html {
    root /var/www/eblusha.org-public;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # Не кешировать JSON с кодом (иначе после смены кода в игре виден старый)
  location = /v/valheim-join-code.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    root /var/www/eblusha.org-public;
    try_files $uri @valheim_json_dist;
  }

  location @valheim_json_dist {
    root /var/www/eblusha.org;
    try_files $uri =404;
  }

  # Сначала frontend/public (rsync/symlink), затем dist — правки в public/ без пересборки
  location / {
    root /var/www/eblusha.org-public;
    try_files $uri $uri/ @spa;
  }

  location @spa {
    root /var/www/eblusha.org;
    try_files $uri $uri/ /index.html;
  }

  # Valheim join code: POST …/refresh → backend только /refresh (иначе 404 на upstream)
  location ^~ /api/valheim-join-code/ {
    rewrite ^/api/valheim-join-code/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:9876;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # LiveKit signal/WebSocket proxy when LIVEKIT_PATH=/api/voice
  location /api/voice/ {
    rewrite ^/api/voice(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Proxy API to Node
  location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;  # Stream uploads so client gets progress events during transfer
  }

  # Socket.IO / WebSocket upgrade
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
