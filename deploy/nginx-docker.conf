# Nginx для Docker Compose: прокси к backend через сеть
# server_name _ ловит любой host (для CasaOS / локального доступа)
# resolver 127.0.0.11 — Docker embedded DNS, чтобы не фейлить старт при недоступном backend
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTPS — для stoned.local (getUserMedia требует HTTPS)
server {
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 100m;

  root /var/www/plus.eblusha.org;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $backend_host backend:4000;
    proxy_pass http://$backend_host$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/voice/ {
    set $livekit_host livekit:7880;
    rewrite ^/api/voice(/.*)$ $1 break;
    proxy_pass http://$livekit_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /socket.io/ {
    set $backend_host backend:4000;
    proxy_pass http://$backend_host$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# HTTP — редирект stoned.local на HTTPS, остальное как раньше
server {
  listen 80;
  server_name stoned.local;
  return 301 https://$host$request_uri;
}

