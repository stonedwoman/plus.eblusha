# Nginx для Docker Compose: прокси к backend через сеть
# server_name _ ловит любой host (для CasaOS / локального доступа)
# resolver 127.0.0.11 — Docker embedded DNS, чтобы не фейлить старт при недоступном backend
resolver 127.0.0.11 valid=10s ipv6=off;

log_format eblusha_panel '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent $request_length "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for" "$host" "$http_x_forwarded_host"';
access_log /dev/stdout eblusha_panel;

# TV Media Viewer (Node на хосте :3000). Иначе Host: tv.local попадал в default_server → Еблуша.
# 172.17.0.1 — шлюз Docker bridge к хосту (при смене сети см. docker network inspect).
server {
  listen 80;
  server_name tv.local;

  location / {
    proxy_pass http://172.17.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
}

server {
  listen 443 ssl;
  server_name tv.local;

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_session_cache shared:SSL:10m;

  location / {
    proxy_pass http://172.17.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }
}

# Старые панели (Homarr / Kuma) сняты — короткий ответ, если DNS ещё указывает сюда
server {
  listen 443 ssl;
  server_name homarr.eblusha.org status.eblusha.org kuma.eblusha.org;

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  return 410;
}

server {
  listen 80;
  server_name homarr.eblusha.org status.eblusha.org kuma.eblusha.org;
  return 410;
}

# eblusha.org origin (Romania): noindex — CF Tunnel / прямой доступ, только эти hostnames
server {
  listen 443 ssl;
  server_name eblusha.org www.eblusha.org voice.eblusha.org;

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_session_cache shared:SSL:10m;

  include /etc/nginx/conf.d/eblusha-origin-locations.inc;
}

server {
  listen 80;
  server_name eblusha.org www.eblusha.org voice.eblusha.org;

  include /etc/nginx/conf.d/eblusha-origin-locations.inc;
}

# HTTPS — для stoned.local (getUserMedia требует HTTPS)
server {
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 1024m;

  # Приём диагностических логов Android-клиента HUILA (кнопка «Отправить логи Роману»).
  # Клиенты ходят по ru.eblusha.org → этот default_server блок (он НЕ включает
  # origin-locations.inc). PUT → writable-том vpn-logs; токен отсекает чужой доступ.
  location ^~ /updates/vpn/logs/ {
    if ($http_x_eblusha_logs != "f947d1a91f4a11a24a5c51a1c0885328") { return 403; }
    limit_except PUT { deny all; }
    client_max_body_size 15m;
    client_body_temp_path /var/www/vpn-logs/.tmp;
    dav_methods PUT;
    create_full_put_path on;
    alias /var/www/vpn-logs/;
  }

  # Каталог обновлений: файлы + браузерный листинг (autoindex) любых подпапок.
  # Без try_files: nginx сам 301-ит папку без слеша на $uri/ (иначе ломаются
  # относительные ссылки листинга). ^~ /updates/vpn/logs/ выше — длиннее префикс.
  location ^~ /updates/ {
    root /var/www/eblusha.org-public;
    charset utf-8;
    disable_symlinks on;  # симлинк внутри updates не должен выводить наружу
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Админка не должна светиться снаружи (CF Tunnel/прямой 443) — видна только на 127.0.0.1:8088.
  location = /admin.html { return 404; }
  location ^~ /api/admin/ { return 404; }

  # public/404.html — см. deploy/nginx-eblusha.org.conf
  error_page 404 /404.html;
  location = /404.html {
    root /var/www/eblusha.org-public;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /v/index.html {
    root /var/www/eblusha.org-public;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # public/ — bind mount всего каталога (включая новые подпапки и файлы): на диске хоста = в контейнере сразу, без пересборки и без reload nginx
  open_file_cache off;

  # Сначала frontend/public (bind mount), затем собранный dist — правки в public/ без npm run build
  # Корень «/»: в public нет index.html; try_files $uri/ находил каталог → 403 (autoindex off)
  location = / {
    root /var/www/eblusha.org-public;
    # ответы из public — без долгого кэша в браузере, чтобы правки были видны сразу после сохранения файла
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html @spa;
  }

  location / {
    root /var/www/eblusha.org-public;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/index.html @spa;
  }

  location @spa {
    root /var/www/eblusha.org;
    try_files $uri $uri/ /index.html;
  }

  # Valheim join code: Python на хосте :9876 (172.17.0.1 = шлюз Docker → хост)
  location ^~ /api/valheim-join-code/ {
    rewrite ^/api/valheim-join-code/(.*)$ /$1 break;
    proxy_pass http://172.17.0.1:9876;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location /api/ {
    set $backend_host backend:4000;
    proxy_pass http://$backend_host$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;  # Stream uploads so client gets progress events during transfer
    proxy_buffering off;
  }

  location /api/voice/ {
    set $livekit_host livekit:7880;
    rewrite ^/api/voice(/.*)$ $1 break;
    proxy_pass http://$livekit_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /socket.io/ {
    set $backend_host backend:4000;
    proxy_pass http://$backend_host$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# HTTP — редирект stoned.local на HTTPS, остальное как раньше
server {
  listen 80;
  server_name stoned.local;
  return 301 https://$host$request_uri;
}

