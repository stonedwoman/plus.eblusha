# Админка — отдельный listener, доступный только с loopback хоста.
# В docker-compose проброшено как 127.0.0.1:8088:8088, поэтому никакой CF Tunnel /
# публичный 80/443 / sing-box сюда не достанут. Доступ:
#   ssh -L 8088:127.0.0.1:8088 host
#   → http://127.0.0.1:8088/admin.html (вводишь ADMIN_TOKEN из .env).
server {
  listen 8088 default_server;
  # *.localhost браузеры автоматически ресолвят в 127.0.0.1 (RFC 6761),
  # так что http://admin.localhost:8088/ или http://eblusha-admin.localhost:8088/ работают
  # после `ssh -L 8088:127.0.0.1:8088 …` без правки /etc/hosts.
  server_name admin.localhost eblusha-admin.localhost _;

  client_max_body_size 16m;

  # Корень → сразу на admin.html, чтобы не вспоминать имя файла.
  location = / { return 302 /admin.html; }

  # Все остальные пути на этом порту молча 404 — снаружи он невидим, но всё равно не светим SPA.
  location / { return 404; }

  # admin.html лежит в frontend/public (bind mount).
  location = /admin.html {
    root /var/www/eblusha.org-public;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /admin.html =404;
  }

  # Сам admin API. Backend всё ещё дополнительно проверяет ADMIN_TOKEN — defense in depth.
  location ^~ /api/admin/ {
    set $backend_host backend:4000;
    proxy_pass http://$backend_host$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
