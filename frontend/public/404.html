<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Еблуша</title>
    <link rel="stylesheet" href="/404.css" />
    <style>
      html {
        overflow-x: hidden;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      #oopss {
        background: linear-gradient(-45deg, #d97706, #ea580c, #f59e0b, #d97706);
        background-size: 300% 300%;
        animation: gradient-shift 10s ease infinite;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
        box-sizing: border-box;
        line-height: 1.5em;
        z-index: 9999;
      }

      @keyframes gradient-shift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      #oopss #error-text {
        font-size: clamp(14px, 3.5vw, 40px);
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0;
        row-gap: 0;
        column-gap: 0;
        min-height: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        font-family:
          'Shabnam',
          system-ui,
          -apple-system,
          'Segoe UI',
          Tahoma,
          sans-serif;
        color: #000;
        direction: ltr;
        text-align: center;
      }

      /* смайлик — сверху; текст — в середине колонки между смайлом и кнопкой */
      #oopss #error-text .face-wrap {
        margin: 0 0 -0.55rem 0;
        line-height: 0;
        flex-shrink: 0;
      }

      #oopss #error-text .face-wrap .face-img {
        display: block;
        height: auto;
        width: auto;
        max-height: min(72vh, 684px);
        max-width: min(90vw, 684px);
        margin: 0 auto -0.1rem;
        object-fit: contain;
        object-position: center top;
      }

      #oopss #error-text .title-lines {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        min-height: 0;
        padding-inline: 0.5rem;
        box-sizing: border-box;
        margin: 0;
      }

      /* как у кнопки .eb404-back: тот же ритм и «плотность» */
      #oopss #error-text .title-lines span {
        position: relative;
        font-family:
          'Shabnam',
          system-ui,
          -apple-system,
          'Segoe UI',
          Tahoma,
          sans-serif;
        font-size: clamp(1.35rem, calc(5vw + 0.35rem), 3.25rem);
        font-weight: 900;
        font-style: normal;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        line-height: 0.92;
        margin: 0;
        max-width: 100%;
        text-align: center;
      }

      #oopss #error-text .title-lines span + span {
        margin-top: -0.06em;
      }

      #oopss #error-text .eb404-back {
        flex-shrink: 0;
        margin-top: 0;
      }

      /*
        Десктоп: как при масштабе страницы 300% в браузере — zoom: 3.
        Базовые размеры ~в 3 раза меньше, чтобы после zoom визуально не вылезать по высоте.
      */
      @media (min-width: 769px) {
        #oopss {
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }

        #oopss #error-text {
          zoom: 3;
          gap: 0;
          row-gap: 0;
          column-gap: 0;
        }

        /* при zoom: 3 отрицательные margin умножаются — берём меньше, чем на мобилке */
        #oopss #error-text .face-wrap {
          margin-bottom: -0.2rem;
        }

        #oopss #error-text .face-wrap .face-img {
          margin-bottom: -0.04rem;
          max-height: min(22vh, 216px);
          max-width: min(22vh, 216px);
        }

        #oopss #error-text .title-lines span {
          font-size: clamp(0.8rem, 1.65vw + 0.3rem, 1.45rem);
          letter-spacing: 0.12em;
        }
      }

      @media (max-width: 480px) {
        #oopss #error-text .face-wrap .face-img {
          max-height: min(64vh, 520px);
          max-width: min(85vw, 520px);
        }

        #oopss #error-text .title-lines {
          padding-inline: 0.35rem;
        }

        #oopss #error-text .title-lines span {
          font-size: clamp(1.2rem, calc(4.8vw + 0.4rem), 2.6rem);
          letter-spacing: 0.1em;
        }
      }

      @media (max-width: 360px) {
        #oopss #error-text .title-lines span {
          font-size: clamp(1.1rem, calc(4.2vw + 0.35rem), 2.35rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #oopss {
          animation: none;
        }
      }

      @font-face {
        font-family: Shabnam;
        src: url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam-Bold.eot');
        src:
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam-Bold.eot?#iefix') format('embedded-opentype'),
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam-Bold.woff') format('woff'),
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam-Bold.woff2') format('woff2'),
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam-Bold.ttf') format('truetype');
        font-weight: bold;
      }

      @font-face {
        font-family: Shabnam;
        src: url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam.eot');
        src:
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam.eot?#iefix') format('embedded-opentype'),
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam.woff') format('woff'),
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam.woff2') format('woff2'),
          url('https://cdn.rawgit.com/ahmedhosna95/upload/ba6564f8/fonts/Shabnam/Shabnam.ttf') format('truetype');
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div id="oopss">
      <div id="error-text">
        <div class="face-wrap" aria-hidden="true">
          <img
            class="face-img"
            src="https://cdn.jsdelivr.net/gh/ahmedhosna95/upload@1731955f/sad404.svg"
            alt=""
            width="684"
            height="684"
            decoding="async"
          />
        </div>
        <div class="title-lines">
          <span>Нихуя</span>
          <span>тут</span>
          <span>нет</span>
        </div>
        <a class="eb404-back" href="/" id="back">НОЗАД</a>
      </div>
    </div>
    <script>
      document.getElementById('back').addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
        if (history.length > 1) {
          e.preventDefault()
          history.back()
        }
      })
    </script>
  </body>
</html>
