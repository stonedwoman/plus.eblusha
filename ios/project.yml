name: Eblusha
options:
  bundleIdPrefix: org.eblusha
  # iOS 18: только там есть честная геометрия прокрутки (onScrollGeometryChange),
  # фазы жеста (onScrollPhaseChange) и раздельные роли якоря (defaultScrollAnchor(_:for:)),
  # без которых лента чата не держит низ и рвёт позицию при вклейке истории.
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# Каркас проекта описан здесь, а не в project.pbxproj: pbxproj нечитаем в диффах и
# конфликтует при любом параллельном изменении. Файл .xcodeproj генерируется на маке
# из этого yml (scripts/ios-build.sh) и в git не хранится.

settings:
  base:
    DEVELOPMENT_TEAM: 4748P9MT6D
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Порт с Kotlin-корутин на строгую конкурентность Swift 6 — отдельная большая работа.
    # Пока держим язык в режиме 5, иначе каждый ViewModel упирается в data-race диагностику.
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.16.0"
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.1"

targets:
  Eblusha:
    type: application
    platform: iOS
    sources:
      - path: Eblusha
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: SocketIO
        product: SocketIO
      # Встраивается в приложение (PlugIns/): «Без звука» и значок для alert-пушей.
      - target: EblushaNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.eblusha.plus
        PRODUCT_NAME: Eblusha
        INFOPLIST_FILE: Eblusha/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Eblusha/Resources/Eblusha.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Номер сборки (CURRENT_PROJECT_VERSION) для TestFlight подставляет
        # scripts/ios-release.sh — из числа коммитов, чтобы рос монотонно.
        # Перекрывается из scripts/ios-build.sh и ios-release.sh.
        EBLUSHA_BUILD_TAG: dev
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Отладочная сборка ходит в ru.eblusha.org — как debug-вариант Android
        # (см. android/app/build.gradle.kts: eblusha.debugApiUrl).
        Debug:
          EBLUSHA_API_BASE_URL: https://ru.eblusha.org/api/
          EBLUSHA_WS_BASE_URL: https://ru.eblusha.org
        Release:
          EBLUSHA_API_BASE_URL: https://eblusha.org/api/
          EBLUSHA_WS_BASE_URL: https://eblusha.org

  # Notification Service Extension (docs/ios-handoff.md §16): через неё проходит каждый alert-пуш
  # о сообщении (mutable-content). Глушит пуш, поставленный сервером за миг до «Без звука» (и не даёт
  # его устаревшему числу лечь на значок); само число ведёт сервер. Из приложения — только два общих
  # файла правил и состояния: у расширения свой
  # процесс и лимит памяти ~24 МБ, LiveKit/SocketIO ему не нужны.
  EblushaNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "**/.DS_Store"
      - path: Eblusha/Core/Mute/ConversationMuteRules.swift
      - path: Eblusha/Core/Mute/MuteSharedState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.eblusha.plus.NotificationService
        PRODUCT_NAME: EblushaNotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # Версии обязаны совпадать с приложением (CURRENT_PROJECT_VERSION ios-release.sh передаёт
        # в командной строке — он ложится на все таргеты).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
